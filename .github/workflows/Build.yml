name: Build

on:
  push:
    branches: [master, branch-*]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '42 02 * * *' # 02:42 daily

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
  queue: ${{ (github.ref_name != github.event.repository.default_branch) && 'single' || 'max' }}

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    outputs:
      build-number: ${{ steps.build.outputs.BUILD_NUMBER }}
      commit-sha: ${{ steps.source-sha.outputs.sha }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}  # Default behaviour is to checkout the commit in detached HEAD state, but this causes warnings in the pipeline. So we explicitly checkout the branch
      - name: Record built commit
        id: source-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          tool_versions: |
            java 21
            maven 3.9
      - name: Build and deploy
        id: build
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy-pull-request: true
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: -Pcoverage
      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit-sha }}
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
          tool_versions: |
            java 21
            maven 3.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          sonar-platform: next

  promote:
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
    needs: [build, analysis]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Promote
        uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [build, analysis, promote]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/branch-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
